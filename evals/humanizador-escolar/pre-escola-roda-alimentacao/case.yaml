schema_version: "1.1"
name: pre-escola-roda-alimentacao
expected_outcome: |
  Texto curto para ser lido em voz alta para crianças de 4 anos, com frases muito curtas e palavras concretas,
  sem "amiguinhos", emojis ou termos como "sistema imunológico"; atividade com um comando simples; notas para a professora
  apontando o que saiu por causa da idade.
